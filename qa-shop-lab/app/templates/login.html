{% extends "base.html" %}
{% block title %} &middot; Ingresar{% endblock %}
{% block page %}login{% endblock %}

{% block content %}
<h1>Ingresar</h1>

<form class="panel form" id="login-form">
    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" autocomplete="username" required>

    <label for="password">Contrasena</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button class="btn btn-primary" type="submit">Ingresar</button>
</form>

<div class="panel">
    <h2>Sesion actual</h2>
    <p id="session-info" class="muted">Sin sesion iniciada.</p>
    <button class="btn btn-ghost" type="button" id="logout-btn">Cerrar sesion</button>
</div>
{% endblock %}
