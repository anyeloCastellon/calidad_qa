# Selenium Lab. Se opera con .\lab.ps1 (Windows) o ./lab.sh (Linux/macOS).
#   app       Version 1: Mini-Blog QA     -> http://localhost:5000   (.\lab.ps1 up)
#   app2      Version 2: TaskFlow QA      -> http://localhost:5000   (.\lab.ps1 up 2)
#   selenium  Chrome remoto (Grid)        -> http://localhost:4444  (ver navegador: http://localhost:7900)
#   tests / tests2   corren pytest contra el Grid (.\lab.ps1 test / .\lab.ps1 test 2)
# Las dos versiones usan el puerto 5000: la lanzadera levanta solo una a la vez.
name: selenium-lab

services:
  app:
    build: .
    profiles: ["v1"]
    environment:
      BLOG_HOST: 0.0.0.0
    # Nombre con el que el navegador del Grid llega a la app. No usar "app":
    # Chrome obliga HTTPS en todo lo que termina en .app (lista HSTS).
    networks:
      default:
        aliases: [miniblog]
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  app2:
    build: .
    profiles: ["v2"]
    command: ["python", "app2/app.py"]
    environment:
      BLOG_HOST: 0.0.0.0
    networks:
      default:
        aliases: [taskflow]
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  selenium:
    # Imagen multi-arquitectura (Intel y Apple Silicon).
    image: selenium/standalone-chromium:latest
    shm_size: 2g
    environment:
      SE_VNC_NO_PASSWORD: "1"
      SE_NODE_MAX_SESSIONS: "1"
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 10s
      retries: 24

  tests:
    build: .
    profiles: ["tests"]
    environment:
      BLOG_URL: http://miniblog:5000
      SELENIUM_REMOTE_URL: http://selenium:4444
    volumes:
      - ./tests:/lab/tests:ro
      - ./resultados:/lab/resultados
    command: ["pytest", "-v", "-p", "no:cacheprovider", "--junitxml=resultados/junit-v1.xml", "tests"]

  tests2:
    build: .
    profiles: ["tests"]
    environment:
      TASKFLOW_URL: http://taskflow:5000
      SELENIUM_REMOTE_URL: http://selenium:4444
    volumes:
      - ./tests2:/lab/tests2:ro
      - ./resultados:/lab/resultados
    command: ["pytest", "-v", "-p", "no:cacheprovider", "--junitxml=resultados/junit-v2.xml", "tests2"]
