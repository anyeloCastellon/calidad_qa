<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}TaskFlow QA{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="{% block clase_body %}{% endblock %}">
  {% if session.get('usuario') %}
  <header class="barra" data-testid="barra">
    <a class="marca" href="{{ url_for('tablero') }}">
      <span class="marca-logo">✓</span> TaskFlow <small>QA</small>
    </a>
    <nav class="barra-nav">
      <a href="{{ url_for('tablero') }}" id="nav-tablero" data-testid="nav-tablero">Tablero</a>
      <a href="{{ url_for('nueva_tarea') }}" id="nav-nueva" class="btn btn-primario btn-sm" data-testid="nav-nueva">+ Nueva tarea</a>
      <span id="saludo" class="saludo" data-testid="saludo">Hola, {{ session.get('nombre') }}</span>
      <a href="{{ url_for('logout') }}" id="btn-salir" class="btn btn-fantasma btn-sm" data-testid="btn-salir">Salir</a>
    </nav>
  </header>
  {% endif %}

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <div id="avisos" class="toasts" aria-live="polite">
    {% for mensaje in get_flashed_messages() %}
      <div id="toast" class="toast" data-testid="toast" role="status">{{ mensaje }}</div>
    {% endfor %}
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
